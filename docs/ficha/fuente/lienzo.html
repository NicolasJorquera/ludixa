<!doctype html>
<!-- Muestra una imagen a pantalla completa: ?src=…&forma=cuadrado|redondeado. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  img { display: block; width: 100vw; height: 100vh; }
  .redondeado { box-sizing: border-box; padding: 4vw; }
  .redondeado img { width: 92vw; height: 92vw; border-radius: 19vw; }
</style></head>
<body><div id="marco"><img id="img" alt=""></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('img').src = q.get('src');
  if (q.get('forma') === 'redondeado') document.body.className = 'redondeado';
</script></body></html>
