name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analizar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formato
        run: dart format --output=none --set-exit-if-changed --line-length 120 .
      - name: Análisis
        run: flutter analyze --fatal-infos
      - name: Pruebas
        run: bash tool/test_all.sh

  build:
    name: Compilar Android (dev)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: APK de depuración del entorno dev
        working-directory: apps/ludixa
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart
