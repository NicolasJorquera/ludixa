name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analizar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Textos generados al día
        working-directory: apps/ludixa
        run: |
          dart run tool/pseudo_l10n.dart
          flutter gen-l10n
          git diff --exit-code -- lib/l10n || (echo "::error::Regenera los idiomas: dart run tool/pseudo_l10n.dart && flutter gen-l10n" && exit 1)
      - name: Textos de los juegos al día
        working-directory: packages/game_sudoku
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n || (echo "::error::Regenera los textos del juego: flutter gen-l10n" && exit 1)
      - name: Formato
        run: dart format --output=none --set-exit-if-changed .
      - name: Análisis
        run: flutter analyze --fatal-infos
      - name: Pruebas
        run: bash tool/test_all.sh

  properties:
    name: Propiedades · ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [minesweeper_engine, sudoku_engine, wordsearch_engine, daily_challenge]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 1.000 semillas por nivel, verificadas (informe en el resumen)
        working-directory: packages/${{ matrix.package }}
        shell: bash
        run: bash ../../tool/properties.sh "${{ matrix.package }}" 1000 bench 730 | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Compilar Android (dev)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: APK de depuración del entorno dev
        working-directory: apps/ludixa
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart
