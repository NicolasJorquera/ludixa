# Reglas compartidas. Cada paquete incluye este archivo desde su propio
# analysis_options.yaml y suma el conjunto base que le corresponde
# (lints para Dart puro, flutter_lints para paquetes Flutter).
formatter:
  page_width: 120

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
