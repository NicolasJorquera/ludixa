name: ludixa
description: "Ludixa: juegos de lógica."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  design_system:
  game_api:
  game_minesweeper:
  game_sudoku:
  game_wordsearch:
  progress:
  go_router: ^17.5.0
  intl: any
  daily_challenge:
  monetization:
  puzzle_core:
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  drift_flutter: ^0.3.1
  file_picker: ^13.3.2

dev_dependencies:
  minesweeper_engine:
  sudoku_engine:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
